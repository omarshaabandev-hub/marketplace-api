[project]
name = "marketplace-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Omar Shaaban",email = "omarshaaban.dev@gmail.com"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "django (>=6.1.2,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-filter (>=26.2,<27.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py"]
addopts = "--cov=apps --cov-report=term-missing"
[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "django-debug-toolbar (>=8.0.0,<9.0.0)"
]
